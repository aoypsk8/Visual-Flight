name: visual_focusflight
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  # ── Flutter SDK ────────────────────────────────────────────────────────────
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State Management & Navigation ─────────────────────────────────────────
  get: ^4.6.6

  # ── HTTP & Networking ──────────────────────────────────────────────────────
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # ── Storage ────────────────────────────────────────────────────────────────
  get_storage: ^2.1.1

  # ── Fonts & Typography ─────────────────────────────────────────────────────
  google_fonts: ^6.2.1

  # ── UI & Assets ────────────────────────────────────────────────────────────
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  sizer: ^2.0.15
  country_flags: ^4.1.2

  # ── Localization ───────────────────────────────────────────────────────────
  intl: ^0.20.2

  # ── Map ────────────────────────────────────────────────────────────────────
  mapbox_maps_flutter: ^2.24.3

  # ── Permissions ────────────────────────────────────────────────────────────
  permission_handler: ^11.3.1

  # ── Utilities ──────────────────────────────────────────────────────────────
  equatable: ^2.0.5
  flutter_dotenv: ^6.0.1
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - .env
    - assets/animations/
    - assets/lottie/
    - assets/icons/
    - assets/images/
    - assets/translations/
    - assets/data/airport_search_index.json


  #   - family: Trajan Pro
